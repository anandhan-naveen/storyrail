name: Bug
description: A defect for the StoryRail defect loop (run it with /storyrail fix <issue number>)
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a page or an API call. Requirement fetch turns these into the regression test.
      placeholder: |
        1. Open the catalog
        2. Add a book with a 300-character title
        3. Click Save
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen. This becomes the acceptance criterion (BUG-<issue number>).
      placeholder: The form shows "Title must be at most 200 characters" and nothing is saved.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Paste screenshots or error messages here.
      placeholder: The page shows a blank error toast and the book is not saved.
    validations:
      required: true
  - type: checkboxes
    id: lanes
    attributes:
      label: Where is it?
      description: Helps requirement fetch pick the lane. Leave empty if unsure.
      options:
        - label: Frontend (screens)
        - label: Backend (API / data)
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker
        - major
        - minor
        - low
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Environment / browser
      placeholder: QA site, Chrome 141 on macOS
